<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>BU-sy</title>
  <meta name="description" content="Find a spot for your free time between classes. A student prototype using sample campus data.">
  <meta name="theme-color" content="#cc0000">
  <link rel="icon" href="assets/terrier.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <header class="side">
      <a class="brand" href="#/" aria-label="BU-sy home"><span class="brand-mark"></span><span class="brand-name">BU-<em>sy</em></span></a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-section="plan"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Plan</span></a>
        <a href="#/places" data-section="places"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Places</span></a>
        <a href="#/calendar" data-section="calendar"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Calendar</span></a>
        <a href="#/clubs" data-section="clubs" class="nav-extra"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span>Clubs</span></a>
      </nav>
      <a class="demo-pill" href="#/about" title="Sample data, not live. About this data">Demo</a>
      <div class="side-card">
        <p class="side-card-title"><span class="dot" aria-hidden="true"></span>Demo data</p>
        <p>Sample counts, hours and walks. Not live BU data.</p>
        <a href="#/about" data-section="about">About this data</a>
      </div>
      <button class="icon-btn theme-btn" id="theme" aria-label="Switch light or dark mode" title="Light / dark">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        <span class="theme-label">Theme</span>
      </button>
    </header>

    <div class="main">
      <div class="notice" id="notice" role="status" hidden></div>
      <main id="view" tabindex="-1"></main>
      <footer class="foot">
        Student prototype · not affiliated with Boston University · <a href="#/about">About this data</a> · <a href="#/clubs">Clubs</a>
        <span class="source-mode" id="source-mode"></span>
      </footer>
    </div>
  </div>

  <noscript><p class="foot">BU-sy needs JavaScript to plan your free time.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
