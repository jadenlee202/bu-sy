<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BU-sy</title>
  <meta name="description" content="Make the most of your time between classes. A student prototype that suggests what fits a free window, using sample campus data.">
  <meta name="theme-color" content="#cc0000">
  <link rel="icon" href="assets/terrier.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/" aria-label="BU-sy home"><span class="brand-mark"></span><span class="brand-name">BU-<em>sy</em></span></a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-section="plan">Plan</a>
        <a href="#/places" data-section="places">Places</a>
      </nav>
      <button class="icon-btn" id="theme" aria-label="Switch light or dark mode" title="Light / dark">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="wrap"></main>

  <footer class="wrap foot">
    Student prototype · not affiliated with Boston University · <a href="#/about">About the data</a> · <a href="#/events">Student meetups</a>
  </footer>

  <noscript><p class="wrap">BU-sy needs JavaScript to plan your free time.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
